name: Desktop release assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "上传已有 Windows artifact 的 run ID；留空则只构建"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.source_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stage desktop distribution
        run: pnpm --filter @superhive/desktop exec node scripts/stage.mjs --rebuild

      - name: Build Windows installer and update package
        run: pnpm --filter @superhive/desktop exec node scripts/forge.mjs make --arch x64 --targets @electron-forge/maker-squirrel

      - name: Collect and checksum release assets
        run: pnpm --filter @superhive/desktop release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win32-x64-${{ github.ref_name }}
          path: apps/desktop/out/release/*/*
          if-no-files-found: error
          retention-days: 7

  upload:
    if: github.event_name == 'workflow_dispatch' && inputs.source_run_id != ''
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read release version
        id: version
        run: |
          $version = (Get-Content packages/superhive/package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: desktop-win32-x64-v${{ steps.version.outputs.version }}
          path: release-assets
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows assets to existing Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $assets = @("SuperHive-$version-win-x64-Setup.exe", "RELEASES", "SuperHive-$version-full.nupkg") | ForEach-Object { Join-Path (Join-Path release-assets $version) $_ }
          foreach ($asset in $assets) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
            Write-Output "$hash  $asset"
          }
          gh release upload "v$version" @assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

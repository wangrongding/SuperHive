name: Desktop release assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stage desktop distribution
        run: pnpm --filter @superhive/desktop exec node scripts/stage.mjs --rebuild

      - name: Build Windows installer and update package
        run: pnpm --filter @superhive/desktop exec node scripts/forge.mjs make --arch x64 --targets @electron-forge/maker-squirrel

      - name: Collect and checksum release assets
        run: pnpm --filter @superhive/desktop release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win32-x64-${{ github.ref_name }}
          path: apps/desktop/out/release/*/*
          if-no-files-found: error
          retention-days: 7

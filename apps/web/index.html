<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SuperHive · 多人 Agent 协作空间</title>
    <script src="/boot-theme.js"></script>
    <!-- 首屏加载占位：蜂巢 logo 描边画出、点亮中心、信号往外扩散（和桌面端启动动画同一套）。
         纯 CSS + 内联 SVG，不等脚本；网页画好后由 src/boot-splash.ts 淡出移除。桌面端由窗口自己盖加载层，这里藏起来。 -->
    <style>
      #boot-splash {
        --bs-bg: #ffffff;
        --bs-g1: #0169cc;
        --bs-g2: #b86e00;
        --loading-text: #0d0d0d;
        --loading-muted: #5d5d5d;
        --loading-accent: var(--bs-g1);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: var(--bs-bg);
        transition: opacity 0.36s ease;
      }
      :root[data-theme="dark"] #boot-splash {
        --bs-bg: #212121;
        --bs-g1: #48aaff;
        --bs-g2: #ffc46b;
        --loading-text: #ececec;
        --loading-muted: #b4b4b4;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #boot-splash {
          --bs-bg: #212121;
          --bs-g1: #48aaff;
          --bs-g2: #ffc46b;
          --loading-text: #ececec;
          --loading-muted: #b4b4b4;
        }
      }
      :root[data-desktop] #boot-splash {
        display: none;
      }
      #boot-splash svg {
        width: 88px;
        height: 88px;
        overflow: visible;
        /* 加载很快时一闪而过不好看：稍等一下再出现 */
        animation: bs-in 0.3s ease 0.15s both;
        transition: transform 0.36s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash.is-leaving svg {
        transform: scale(0.72);
      }
      .boot-splash-content {
        width: min(360px, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        min-height: 248px;
        transform: translateY(-2vh);
      }
      .loading-status {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .loading-copy {
        width: 100%;
        max-width: 360px;
        min-height: 64px;
      }
      .loading-title,
      .loading-hint,
      .loading-help {
        margin: 0;
        line-height: 1.6;
      }
      .loading-title {
        color: var(--loading-text, var(--text, #0d0d0d));
        font-size: 15px;
        font-weight: 600;
      }
      .loading-hint {
        color: var(--loading-muted, var(--text-secondary, #5d5d5d));
        font-size: 13px;
        margin-top: 8px;
        overflow-wrap: anywhere;
      }
      .loading-help {
        font-size: 13px;
      }
      .loading-help a {
        color: var(--loading-accent, var(--accent, #0169cc));
        text-underline-offset: 3px;
      }
      .loading-help a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 4px;
        border-radius: 2px;
      }
      :root[lang="en"] #boot-splash [lang="zh-CN"],
      :root:not([lang="en"]) #boot-splash [lang="en"] {
        display: none;
      }
      #boot-splash:not([data-managed]) .loading-help,
      #boot-splash:not([data-managed]) [data-loading-fallback] {
        visibility: hidden;
        animation: bs-help 0s 4s forwards;
      }
      @keyframes bs-help {
        to {
          visibility: visible;
        }
      }
      #boot-splash[data-failed="true"] svg,
      #boot-splash[data-failed="true"] .line,
      #boot-splash[data-failed="true"] .dot,
      :root[data-reduce-motion="true"] #boot-splash svg,
      :root[data-reduce-motion="true"] #boot-splash .line,
      :root[data-reduce-motion="true"] #boot-splash .dot {
        animation: none;
        opacity: 1;
        stroke-dashoffset: 0;
        transform: none;
      }
      #boot-splash[data-failed="true"] .ring,
      :root[data-reduce-motion="true"] #boot-splash .ring {
        display: none;
      }
      :root[data-reduce-motion="true"] #boot-splash {
        transition: none;
      }
      #boot-splash .s1 {
        stop-color: var(--bs-g1);
      }
      #boot-splash .s2 {
        stop-color: var(--bs-g2);
      }
      #boot-splash .line {
        fill: none;
        stroke: url(#bs-g);
        stroke-width: 2.6;
        stroke-linejoin: round;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: bs-draw 0.95s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards;
      }
      #boot-splash .inner {
        opacity: 0.5;
        stroke-dashoffset: -100;
        animation-delay: 0.5s;
      }
      #boot-splash .dot,
      #boot-splash .ring {
        transform-box: fill-box;
        transform-origin: center;
      }
      #boot-splash .dot {
        fill: url(#bs-g);
        transform: scale(0);
        animation: bs-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s forwards;
      }
      #boot-splash .ring {
        fill: none;
        stroke: var(--bs-g1);
        stroke-width: 1.3;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
        opacity: 0;
        animation: bs-ring 2.2s cubic-bezier(0.2, 0.6, 0.35, 1) 1.4s infinite;
      }
      @keyframes bs-in {
        from {
          opacity: 0;
        }
      }
      @keyframes bs-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes bs-pop {
        to {
          transform: scale(1);
        }
      }
      @keyframes bs-ring {
        0% {
          opacity: 0.7;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(9);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash svg {
          animation: none;
        }
        #boot-splash .line,
        #boot-splash .dot {
          animation: none;
          stroke-dashoffset: 0;
          transform: none;
        }
        #boot-splash .ring {
          display: none;
        }
        #boot-splash,
        #boot-splash svg {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="loading-status">
      <div class="boot-splash-content">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="bs-g" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
              <stop class="s1" offset="0" />
              <stop class="s2" offset="1" />
            </linearGradient>
          </defs>
          <path class="ring" d="M24 20.6L26.94 22.3L26.94 25.7L24 27.4L21.06 25.7L21.06 22.3Z" />
          <path class="line" pathLength="100" d="m24 3 18 10.5v21L24 45 6 34.5v-21L24 3Z" />
          <path class="line inner" pathLength="100" d="m24 12 10 6v12l-10 6-10-6V18l10-6Z" />
          <circle class="dot" cx="24" cy="24" r="3" />
        </svg>
        <div class="loading-copy" role="status" aria-live="polite" aria-atomic="true">
          <p class="loading-title" data-loading-title>
            <span lang="zh-CN">打开蜂巢</span><span lang="en">Opening the hive</span>
          </p>
          <p class="loading-hint" data-loading-hint>
            <span lang="zh-CN">给蜂巢轻轻敲个门…</span
            ><span lang="en">A little knock on the hive door…</span>
          </p>
          <p class="loading-hint" data-loading-fallback>
            <span lang="zh-CN">网页资源还在载入，请检查网络或重新加载。</span
            ><span lang="en">Page resources are still loading. Check your network or reload.</span>
          </p>
        </div>
        <p class="loading-help" data-loading-help>
          <a href=""><span lang="zh-CN">重新加载</span><span lang="en">Reload</span></a>
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/boot-splash-entry.ts"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img" aria-labelledby="startup-title startup-desc">
  <title id="startup-title">Diagram: adding an Agent manually</title>
  <desc id="startup-desc">Not a real UI screenshot. Pick a runtime and click Next, pick access and click Next, then check the name, directory and MCP. Start one to five identical Agents on the Server computer, or copy the command to run on another computer. Managing remote devices requires the matching approval.</desc>
  <defs>
    <marker id="startup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8f8f8f" />
    </marker>
  </defs>
  <rect width="1080" height="590" rx="24" fill="#f9f9f9" />
  <g font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif">
    <rect x="50" y="32" width="102" height="30" rx="15" fill="#e8e8e8" />
    <text x="101" y="53" font-size="17" font-weight="700" text-anchor="middle" fill="#0d0d0d">How-to</text>
    <text x="50" y="109" font-size="32" font-weight="700" fill="#0d0d0d">Add agent: choose, then click Next</text>
    <text x="1028" y="53" font-size="17" text-anchor="end" fill="#5d5d5d">Diagram · Not a real UI screenshot</text>

    <g fill="#ffffff" stroke="#e8e8e8" stroke-width="2">
      <rect x="50" y="145" width="300" height="182" rx="18" />
      <rect x="390" y="145" width="300" height="182" rx="18" />
      <rect x="730" y="145" width="300" height="182" rx="18" />
    </g>
    <g fill="#0d0d0d">
      <circle cx="86" cy="184" r="19" />
      <circle cx="426" cy="184" r="19" />
      <circle cx="766" cy="184" r="19" />
    </g>
    <g font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="86" y="191">1</text>
      <text x="426" y="191">2</text>
      <text x="766" y="191">3</text>
    </g>
    <g font-size="24" font-weight="700" fill="#0d0d0d">
      <text x="118" y="193">Pick a runtime</text>
      <text x="458" y="193">Pick access</text>
      <text x="798" y="193">Check settings</text>
    </g>
    <g font-size="18" fill="#5d5d5d">
      <text x="74" y="228">Have the CLI installed</text>
      <text x="74" y="252">and signed in first</text>
      <text x="414" y="228">Default: Workspace</text>
      <text x="414" y="252">Full access by default</text>
      <text x="754" y="228">Name, directory and</text>
      <text x="754" y="252">MCP add-ons</text>
    </g>
    <g font-size="19" font-weight="700" fill="#0d0d0d">
      <text x="74" y="287">Click “Next” yourself</text>
      <text x="414" y="287">Click “Next” yourself</text>
      <text x="754" y="287">Confirm where it runs</text>
    </g>
    <g fill="none" stroke="#8f8f8f" stroke-width="2.5" marker-end="url(#startup-arrow)">
      <path d="M 354 236 H 381" />
      <path d="M 694 236 H 721" />
      <path d="M 880 329 V 365 H 278 V 391" />
      <path d="M 880 365 H 802 V 391" />
    </g>

    <rect x="50" y="400" width="456" height="116" rx="18" fill="#e6f0fa" />
    <rect x="574" y="400" width="456" height="116" rx="18" fill="#fff5e7" />
    <text x="74" y="439" font-size="24" font-weight="700" fill="#0d0d0d">Start on the Server computer</text>
    <text x="74" y="476" font-size="19" fill="#5d5d5d">1–5 agents · same settings · one at a time</text>
    <text x="598" y="439" font-size="24" font-weight="700" fill="#b26b00">Copy command to another PC</text>
    <text x="598" y="476" font-size="19" fill="#805000">CLI runs there · keep credentials private</text>
    <text x="50" y="557" font-size="18" fill="#5d5d5d">Remote owner devices need admin approval; a failed create doesn't roll back Agents already started.</text>
  </g>
</svg>

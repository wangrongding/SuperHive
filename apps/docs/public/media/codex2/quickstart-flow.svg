<svg xmlns="http://www.w3.org/2000/svg" width="760" height="880" aria-labelledby="title desc" role="img" viewBox="0 0 760 880"><title id="title">第一个 Agent 任务：四步操作示意</title><desc id="desc">启动 Hive Server，在本机打开演示房间，手动完成下一步接入一个只读 Agent，再发送定向消息并查看回复。示意图不是实际界面截图。</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#5d5d5d" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="760" height="880" fill="#f9f9f9" rx="24"/><g fill="#0d0d0d" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif"><text x="38" y="58" font-size="32" font-weight="700">从启动到第一条回复</text><text x="38" y="98" fill="#5d5d5d" font-size="24">原创流程示意 · 非实际界面截图</text><rect width="684" height="132" x="38" y="128" fill="#fff" stroke="#e8e8e8" stroke-width="2" rx="16"/><circle cx="80" cy="170" r="24" fill="#0d0d0d"/><text x="80" y="179" fill="#fff" font-size="26" text-anchor="middle">1</text><text x="120" y="179" font-size="28" font-weight="700">启动 Hive Server</text><text x="64" y="223" font-size="25">npm i -g superhive → hive</text><path fill="none" stroke="#5d5d5d" stroke-width="3" marker-end="url(#arrow)" d="M 380 270 V 296"/><rect width="684" height="132" x="38" y="308" fill="#fff" stroke="#e8e8e8" stroke-width="2" rx="16"/><circle cx="80" cy="350" r="24" fill="#0d0d0d"/><text x="80" y="359" fill="#fff" font-size="26" text-anchor="middle">2</text><text x="120" y="359" font-size="28" font-weight="700">打开网页，准备演示房间</text><text x="64" y="403" font-size="25">本机房主登录 · 暂不挂真实项目目录</text><path fill="none" stroke="#5d5d5d" stroke-width="3" marker-end="url(#arrow)" d="M 380 450 V 476"/><rect width="684" height="132" x="38" y="488" fill="#e6f0fa" stroke="#93bde5" stroke-width="2" rx="16"/><circle cx="80" cy="530" r="24" fill="#0d0d0d"/><text x="80" y="539" fill="#fff" font-size="26" text-anchor="middle">3</text><text x="120" y="539" font-size="28" font-weight="700">接入 1 个只读 Agent</text><text x="64" y="583" font-size="25">选 Runtime → 下一步 → 只读 → 下一步</text><path fill="none" stroke="#5d5d5d" stroke-width="3" marker-end="url(#arrow)" d="M 380 630 V 656"/><rect width="684" height="132" x="38" y="668" fill="#e8f5ef" stroke="#94c5b1" stroke-width="2" rx="16"/><circle cx="80" cy="710" r="24" fill="#23634d"/><text x="80" y="719" fill="#fff" font-size="26" text-anchor="middle">4</text><text x="120" y="719" font-size="28" font-weight="700">发送定向消息，查看回复</text><text x="64" y="763" font-size="25">@guide-agent 请只回复“已连接”</text><text x="38" y="846" fill="#5d5d5d" font-size="24">示例名为虚构；上线与权限能力需分别核对。</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" aria-labelledby="title desc" role="img" viewBox="0 0 900 460"><title id="title">SuperHive monorepo运行关系</title><desc id="desc">apps/web和IM访问apps/server，protocol连接Server与superhive Bridge，Bridge调用各Provider；apps/docs单独生成静态HTML。架构示意非截图。</desc><rect width="900" height="460" fill="#f3f3f3" rx="18"/><g font-family="system-ui,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#e8e8e8"><rect width="230" height="90" x="35" y="60" rx="12"/><rect width="230" height="90" x="335" y="60" rx="12"/><rect width="230" height="90" x="635" y="60" rx="12"/><rect width="230" height="82" x="335" y="215" rx="12"/><rect width="230" height="82" x="635" y="215" rx="12"/></g><g fill="#0d0d0d" font-size="21" font-weight="600"><text x="150" y="98">apps/web + IM</text><text x="450" y="98">apps/server</text><text x="750" y="98">superhive Bridge</text><text x="450" y="249">packages/protocol</text><text x="750" y="249">Provider CLI / SDK</text></g><g fill="#5d5d5d" font-size="15"><text x="150" y="128">人看到的协作界面</text><text x="450" y="128">公共时间线与授权</text><text x="750" y="128">任务队列与本机执行</text><text x="450" y="278">共用类型与Schema</text><text x="750" y="278">会话 · 工具 · 用量</text></g><g fill="none" stroke="#0d0d0d" stroke-width="3"><path d="M265 105h70M565 105h70M450 150v65M750 150v65"/></g><path stroke="#e8e8e8" stroke-dasharray="6 6" d="M35 334h830"/><rect width="230" height="67" x="35" y="355" fill="#0d0d0d" rx="12"/><text x="150" y="396" fill="#fff" font-size="21" font-weight="600">apps/docs</text><text x="545" y="383" fill="#0d0d0d" font-size="19">Astro → 静态 HTML + 搜索索引</text><text x="545" y="412" fill="#5d5d5d" font-size="15">独立部署，不连接 Hive 业务数据库</text><text x="450" y="445" fill="#5d5d5d" font-size="12">代码架构示意 · 非实际界面截图</text></g></svg>